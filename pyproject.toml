[project]
name = "pdf-audiobook"
version = "0.1.0"
description = "Private localhost PDF-to-audiobook application"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.139.2",
    "pdfplumber==0.11.10",
    "pypdf==6.15.0",
    "uvicorn==0.51.0",
]

[dependency-groups]
test = [
    "pytest==8.3.5",
    "httpx2==2.7.0",
]

[project.scripts]
voice-benchmark = "benchmark.cli:main"
pdf-audiobook = "pdf_audiobook.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_audiobook"]
